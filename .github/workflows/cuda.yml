# Tier 2 — the host feature and a real device codegen, on CPU.
#
# This is `modal_app.py::build`, through `scripts/modal-run`: clippy over all
# three crates with `--features host`, the host tests, and a full `cargo oxide
# build --arch sm_100a` of *both* kernel crates against the CUDA driver stub.
# That last part
# is the reason this job exists. A post-monomorphization `const { assert!(..) }`
# in a tile shape fires at codegen, not at type-check, so it is invisible to
# `cargo check` and only a real device build finds it. Highest value per minute
# in the whole setup, and it needs no GPU.
#
# WHY MODAL AND NOT A CUDA CONTAINER ON A GITHUB RUNNER
#
# A `nvidia/cuda:13.0.0-devel-ubuntu24.04` job container would supply `cuda.h`
# cheaply, but the toolkit is the small half of what this needs. The rest is
# LLVM 21 from apt.llvm.org, the pinned nightly with rust-src/rustc-dev/
# llvm-tools, `cargo-oxide` installed from git, and a bootstrap build of the
# cuda-oxide rustc codegen backend. On Modal that is a content-addressed image
# layer, already built, shared byte-for-byte with the recipe it was copied
# from. On a fresh GitHub runner it is a cold build every time unless we
# publish our own image to GHCR — which means a second definition of the
# toolchain, maintained beside `modal_app.py` and free to drift from it.
#
# So: one definition of the toolchain, in `modal_app.py`, invoked identically
# from a laptop and from CI. The price is that this tier needs a credential,
# and therefore cannot run on a pull request from a fork. See CI.md.
#
# Cost: ~8 CPU for the length of a cold cargo build of the pinned deps. No GPU
# is allocated, so this is Modal CPU-minutes — cents, not dollars. It is still
# not free, which is why it does not run on every branch push.

name: cuda

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to check out (e.g. refs/pull/17/merge). Defaults to this workflow's ref."
        required: false
        type: string

concurrency:
  group: cuda-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secrets are absent on a pull request from a fork, so the job would fail
    # at `modal run` rather than skip. Skip it explicitly instead, and leave a
    # maintainer to dispatch it by hand against the merge ref after reading the
    # diff — that manual step *is* the review gate on spending our compute.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The `secrets` context is not readable from a job-level `if`, so an
      # unconfigured repo cannot be turned into a skip. Fail it legibly and
      # first instead: a named secret beats a Modal auth traceback.
      - name: Modal credential is configured
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set on this repository, so tier 2 cannot run. Get them from \`modal token new\`. See CI.md."
            exit 1
          fi
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Nothing else to cache: the expensive artifacts live in the Modal image,
      # which is content-addressed and rebuilt only when `modal_app.py`'s
      # recipe changes.
      - run: pip install modal

      # `scripts/modal-run`, not `modal run` — the same wrapper a laptop uses,
      # for the same two reasons, both of which CI has more of rather than less.
      # A container can wedge before it reaches Python (#99), where `timeout=`
      # is the only thing that ever stops it and nothing inside `modal_app.py`
      # runs to notice; and `modal run`'s exit code is not a completion signal
      # (#115) — one stopped app gave 1, an indefinite hang, and a field report
      # of 0. The wrapper returns 0 only on the sentinel, and 2/3/4 for the
      # spend limit, a wedge it stopped, and a run that ended without
      # finishing. It is the last command in the step, so its code is the
      # step's code and every one of those is red; it annotates 2/3/4 itself so
      # the diagnosis lands on the check rather than in a log nobody opens.
      - name: cargo clippy --features host, host tests, sm_100a device build
        run: scripts/modal-run build
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

  # `modal_app.py::regcount` — the `ptxas -v` table, the shape ladder,
  # #63's timed twins, and since #95 a **gate**: a kernel that crosses its
  # occupancy step fails this job. Until #95 that entry point existed and ran
  # nowhere, so the only thing between `gemm_cg2` and a silent third of its
  # occupancy was somebody remembering to run it and read a column.
  #
  # A job of its own rather than a step in `build`, for two reasons. It goes red
  # for a different reason than `build` does — a register count, not a compile —
  # and that distinction is worth having on the check list rather than inside a
  # log. And it is independent work, so it runs beside `build` instead of after
  # it. The price is honest: it builds both kernel crates again in its own
  # container, so tier 2 costs roughly twice what it did. Still CPU-minutes.
  regcount:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Modal credential is configured
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set on this repository, so tier 2 cannot run. Get them from \`modal token new\`. See CI.md."
            exit 1
          fi
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install modal

      # Through the wrapper, as `build` is above.
      - name: ptxas register table, the ladder, and the occupancy-step gate
        run: scripts/modal-run regcount
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
