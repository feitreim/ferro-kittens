[package]
name = "ferro-kittens"
version = "0.1.0"
edition = "2024"
description = "A ThunderKittens-style tile library for cuda-oxide, targeting Blackwell tcgen05."
repository = "https://github.com/feitreim/ferro-kittens"
license = "MIT"
# `device-tests` is a separate kernel crate with its own workspace: this
# library deliberately ships no `#[cuda_module]`, so the harness that needs one
# lives outside the package. Excluded so `cargo` at the root never sees it.
exclude = ["device-tests", "modal_app.py"]

[lib]
name = "kittens"

[features]
# Host-side TMA tensor-map builders (global.rs). Off by default so the
# device-only surface can be `cargo check`ed without a CUDA toolkit.
host = ["dep:cuda-core"]

[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "b099f64c1a32869b74be99f4f88242fb68655b51" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "b099f64c1a32869b74be99f4f88242fb68655b51", optional = true }
