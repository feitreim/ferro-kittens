[package]
# The lab notebook, split out of `examples/` so that crate can be read in one
# sitting. Everything here is a measurement: every rung of every sweep, every
# probe that computes a deliberately wrong `C` to price one term, the
# benchmark harness, the cuBLASLt denominator, and `README.md` — the record of
# what all of it measured.
name = "kittens-experiments"
version = "0.1.0"
edition = "2024"

# Standalone workspace, like `device-tests` and `examples`: `cargo` at the repo
# root never sees this crate, so a probe that is not a GEMM cannot break the
# library's build or its CI.
[workspace]

[features]
# The cuBLASLt baseline `bench` divides by (#92). Off by default, and it is the
# link step rather than the code that makes that necessary: turning it on makes
# the binary need `libcublasLt.so` from a *devel* CUDA toolkit, which tier 1 CI
# does not have and which nobody should need in order to build this crate.
cublas = []

[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "b099f64c1a32869b74be99f4f88242fb68655b51" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "b099f64c1a32869b74be99f4f88242fb68655b51" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "b099f64c1a32869b74be99f4f88242fb68655b51" }
kittens = { package = "ferro-kittens", path = "..", features = ["host"] }

[profile.release]
debug = false
lto = true
