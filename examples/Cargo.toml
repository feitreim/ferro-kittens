[package]
# Not `examples`: cargo forbids that as a binary target name, since it is one
# of its own build directory names. The directory keeps the name the issue
# asked for; the artifact is `kittens-examples`.
name = "kittens-examples"
version = "0.1.0"
edition = "2024"

# Standalone workspace, like `device-tests` and `experiments`: `cargo` at the
# repo root never sees this crate, so an aspirational kernel that names API we
# have not written yet cannot break the library's build or its CI.
[workspace]

# No features at all. Each aspirational kernel used to sit behind one and be off
# by default, so that everything in the default build genuinely compiled and
# turning a feature on printed that kernel's gap list as compiler errors. Every
# gap list is empty now (#3 closed the last one), so the features held nothing
# back — and worse, a gated kernel is absent from the default set that
# `cargo oxide build kittens-examples --arch sm_100a` compiles, which made the
# examples with the most library surface in them the ones CI never codegened.
# All four kernels are in the default build.
#
# The one feature that survived that, `cublas`, went to `experiments/` with the
# benchmark it gates: nothing here divides by a vendor library, so nothing here
# needs a *devel* CUDA toolkit to link against.

[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "20a56163f258e09f2c51e4c27ae4e4ff17582443" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "20a56163f258e09f2c51e4c27ae4e4ff17582443" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "20a56163f258e09f2c51e4c27ae4e4ff17582443" }
# `host` for the tensor-map builders: the binary is a launcher now, not just a
# compilation witness, and a kernel with a TMA operand cannot be launched
# without one.
kittens = { package = "ferro-kittens", path = "..", features = ["host"] }
half = "2.7.1"

[profile.release]
debug = false
lto = true
